<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>I love you!</title>
    <link rel="stylesheet" href="stylesheet.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="Index">
    <h1 class="Index">❤️Sarah, will you be my valentines?❤️</h1>
    <div class="button-container">
      <button
        onclick="location.href = 'yes.html'"
        class="valentine-btn yes-btn"
      >
        Yes 💘
      </button>
      <button id="no-btn" class="valentine-btn yes-btn">No😞</button>
    </div>
    <script>
      const noBtn = document.getElementById("no-btn");
      const container = document.querySelector(".button-container");

      // store container size
      const containerRect = container.getBoundingClientRect();

      noBtn.addEventListener("mouseenter", () => {
        // get button size
        const btnWidth = noBtn.offsetWidth;
        const btnHeight = noBtn.offsetHeight;

        // calculate random position inside container
        const maxX = container.clientWidth - btnWidth;
        const maxY = container.clientHeight - btnHeight;

        const x = Math.random() * maxX;
        const y = Math.random() * maxY;

        noBtn.style.position = "absolute"; // allow moving
        noBtn.style.left = x + "px";
        noBtn.style.top = y + "px";
      });
    </script>
  </body>
</html>
